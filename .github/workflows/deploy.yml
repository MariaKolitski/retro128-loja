# Publica a loja no GitHub Pages.
#  - A cada push na branch main, publica a versão atual (deploy normal).
#  - Pela aba Actions > "Deploy no GitHub Pages" > "Run workflow" é possível
#    publicar QUALQUER versão anterior (tag, branch ou commit): é o nosso ROLLBACK.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar (tag como v1.0.0, branch ou SHA). Vazio = main"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o código da versão escolhida
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.versao || github.sha }}

      - name: Migrar capas para assets/capas
        run: |
          mkdir -p assets/capas
          cp -n img/capas/*.svg assets/capas/

      - name: Validar capas citadas no catálogo
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.cwd();
          const config = JSON.parse(fs.readFileSync('config/app-config.json', 'utf8'));
          const catalog = JSON.parse(fs.readFileSync(config.catalogoUrl, 'utf8'));
          if (!Array.isArray(catalog.jogos) || catalog.jogos.length === 0) {
            throw new Error('O catálogo não contém jogos para validar.');
          }
          const pasta = path.resolve(root, config.pastaCapas);
          const pastaRelativa = path.relative(root, pasta);
          if (pastaRelativa.startsWith('..') || path.isAbsolute(pastaRelativa)) {
            throw new Error('A pasta de capas precisa estar dentro do projeto.');
          }
          const ausentes = catalog.jogos.filter((jogo) => {
            const arquivo = path.resolve(pasta, jogo.capa);
            const relativo = path.relative(pasta, arquivo);
            return relativo.startsWith('..') || path.isAbsolute(relativo) || !fs.existsSync(arquivo);
          });
          if (ausentes.length) {
            console.error('Capas ausentes ou fora da pasta configurada:');
            ausentes.forEach((jogo) => console.error(`- ${jogo.id}: ${jogo.capa}`));
            process.exit(1);
          }
          console.log(`${catalog.jogos.length} capas validadas em ${pastaRelativa}/`);
          NODE

      - name: Carimbar a versão publicada (build-info.json)
        env:
          REF_PUBLICADA: ${{ inputs.versao || github.ref_name }}
          EVENTO: ${{ github.event_name }}
          EXECUCAO: ${{ github.run_number }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATA=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"ref":"%s","commit":"%s","dataDeploy":"%s","evento":"%s","execucao":"%s"}\n' \
            "$REF_PUBLICADA" "$COMMIT" "$DATA" "$EVENTO" "$EXECUCAO" > build-info.json
          echo "Publicando $REF_PUBLICADA (commit $COMMIT) — evento: $EVENTO"
          cat build-info.json

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
